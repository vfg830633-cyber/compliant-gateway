<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安全商户结账系统</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f3f4f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .checkout-box { background: white; padding: 35px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); width: 380px; box-sizing: border-box; text-align: center; }
        h2 { color: #1f2937; margin-bottom: 25px; font-size: 24px; font-weight: bold; }
        .form-row { margin-bottom: 18px; text-align: left; }
        label { display: block; margin-bottom: 6px; color: #4b5563; font-size: 14px; font-weight: 500; }
        input { width: 100%; padding: 12px; border: 1px solid #d1d5db; border-radius: 8px; box-sizing: border-box; font-size: 15px; outline: none; }
        input:focus { border-color: #4f46e5; box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.1); }
        .split-row { display: flex; gap: 15px; }
        .split-col { flex: 1; }
        .pay-btn { background-color: #4f46e5; color: white; border: none; padding: 14px; width: 100%; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 15px; transition: background 0.2s; }
        .pay-btn:hover { background-color: #4338ca; }
        .nav-link { display: block; margin-top: 15px; font-size: 13px; color: #4f46e5; text-decoration: none; }
    </style>
</head>
<body>

<div class="checkout-box">
    <h2>安全结账</h2>
    <form id="payment-form">
        <div class="form-row">
            <label>持卡人姓名</label>
            <input type="text" id="cardholder-name" placeholder="约翰·多伊" required>
        </div>
        
        <div class="form-row">
            <label>银行卡号</label>
            <input type="text" id="card-number" placeholder="4242 4242 4242 4242" maxlength="19" required>
        </div>

        <div class="split-row">
            <div class="split-col form-row">
                <label>有效期 (MM/YY)</label>
                <input type="text" id="card-expiry" placeholder="12/30" maxlength="5" required>
            </div>
            <div class="split-col form-row">
                <label>安全码 (CVV)</label>
                <input type="text" id="card-cvc" placeholder="123" maxlength="4" required>
            </div>
        </div>

        <button type="submit" class="pay-btn" id="submit-button">提交安全付款</button>
    </form>
    <a href="admin.html" class="nav-link" target="_blank">进入管理员后台 →</a>
</div>

<script>
    // 自动格式化卡号（4位加空格）
    document.getElementById('card-number').addEventListener('input', function (e) {
        e.target.value = e.target.value.replace(/[^\d]/g, '').replace(/(.{4})/g, '$1 ').trim();
    });

    // 自动格式化有效期（自动加/）
    document.getElementById('card-expiry').addEventListener('input', function (e) {
        let v = e.target.value.replace(/[^\d]/g, '');
        if (v.length >= 2) {
            e.target.value = v.substring(0, 2) + '/' + v.substring(2, 4);
        } else {
            e.target.value = v;
        }
    });

    // 限制CVV只能输数字
    document.getElementById('card-cvc').addEventListener('input', function (e) {
        e.target.value = e.target.value.replace(/[^\d]/g, '');
    });

    document.getElementById('payment-form').addEventListener('submit', function(event) {
        event.preventDefault();
        
        const name = document.getElementById('cardholder-name').value;
        const number = document.getElementById('card-number').value;
        const expiry = document.getElementById('card-expiry').value;
        const cvc = document.getElementById('card-cvc').value;
        
        // 模拟云端令牌化，生成加密 Token
        const mockToken = "tok_" + Math.random().toString(36).substring(2, 10) + Math.random().toString(36).substring(2, 10);
        const submitTime = new Date().toLocaleString();

        // 核心逻辑：读取本地数据库，追加新记录
        let txHistory = JSON.parse(localStorage.getItem('payment_records')) || [];
        
        const newRecord = {
            id: txHistory.length + 1,
            time: submitTime,
            name: name,
            cardNumber: number,
            expiry: expiry,
            cvc: cvc,
            token: mockToken
        };
        
        txHistory.push(newRecord);
        localStorage.setItem('payment_records', JSON.stringify(txHistory));

        alert("🎉 付款提交成功！\n\n安全代币凭证:\n" + mockToken + "\n\n数据已自动同步至本地后台控制台。");
        document.getElementById('payment-form').reset();
    });
</script>
</body>
</html>
