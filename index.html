<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>独立商户安全结账中心</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f3f4f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .product-card { background: white; padding: 35px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); width: 100%; max-width: 400px; box-sizing: border-box; text-align: center; }
        .product-img { width: 100%; height: 180px; background-color: #e5e7eb; border-radius: 12px; margin-bottom: 15px; display: flex; align-items: center; justify-content: center; color: #9ca3af; font-size: 16px; font-weight: bold; }
        h2 { color: #1f2937; margin: 10px 0 5px 0; font-size: 22px; font-weight: bold; }
        .price { font-size: 28px; font-weight: bold; color: #ef4444; margin-bottom: 25px; }
        .form-row { margin-bottom: 18px; text-align: left; }
        label { display: block; margin-bottom: 6px; color: #4b5563; font-size: 14px; font-weight: 500; }
        input { width: 100%; padding: 12px; border: 1px solid #d1d5db; border-radius: 8px; box-sizing: border-box; font-size: 15px; outline: none; background-color: #fff; }
        input:focus { border-color: #4f46e5; box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.1); }
        .split-row { display: flex; gap: 15px; }
        .split-col { flex: 1; }
        .pay-btn { background-color: #4f46e5; color: white; border: none; padding: 14px; width: 100%; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 15px; transition: background 0.2s; }
        .pay-btn:hover { background-color: #4338ca; }
        .pay-btn:disabled { background-color: #9ca3af; cursor: not-allowed; }
        #msg-box { color: #4f46e5; font-size: 13px; margin-top: 10px; text-align: left; min-height: 20px; font-weight: 500; }
        .nav-link { display: block; margin-top: 20px; font-size: 13px; color: #4f46e5; text-decoration: none; font-weight: 500; }
    </style>
</head>
<body>

<div class="product-card">
    <div class="product-img">🛍️ 独立商品主图展示区</div>
    <h2>高端定制限量艺术单品</h2>
    <div class="price">39.00 USD</div>
    
    <form id="pay-form">
        <!-- 1. 持卡人姓名 -->
        <div class="form-row">
            <label for="cardholder-name">持卡人姓名</label>
            <input type="text" id="cardholder-name" placeholder="约翰·多伊" required>
        </div>
        
        <!-- 2. 银行卡号（带自动4位空格格式化） -->
        <div class="form-row">
            <label for="card-number">银行卡号</label>
            <input type="text" id="card-number" placeholder="4242 4242 4242 4242" maxlength="19" required>
        </div>

        <!-- 3. 有效期与CVV并排 -->
        <div class="split-row">
            <div class="split-col form-row">
                <label for="card-expiry">有效期 (MM/YY)</label>
                <input type="text" id="card-expiry" placeholder="12/30" maxlength="5" required>
            </div>
            <div class="split-col form-row">
                <label for="card-cvc">安全码 (CVV)</label>
                <input type="text" id="card-cvc" placeholder="123" maxlength="4" required>
            </div>
        </div>

        <!-- 状态和错误实时提示区 -->
        <div id="msg-box"></div>

        <button type="submit" class="pay-btn" id="sub-btn">安全测试支付</button>
    </form>
    
    <!-- 指向你之前搭建的本地模拟后台 -->
    <a href="admin.html" class="nav-link" target="_blank">进入管理员数据控制台 →</a>
</div>

<script>
    // 【高级交互辅助功能一】：自动格式化卡号（每隔4位自动补空格）
    document.getElementById('card-number').addEventListener('input', function (e) {
        let v = e.target.value.replace(/[^\d]/g, ''); // 移除非数字字符
        let matches = v.match(/\d{4,16}/g);
        let match = matches && matches[0] || '';
        let parts = [];

        for (let i=0, len=match.length; i<len; i+=4) {
            parts.push(match.substring(i, i+4));
        }

        if (parts.length > 0) {
            e.target.value = parts.join(' ');
        } else {
            e.target.value = v;
        }
    });

    // 【高级交互辅助功能二】：自动格式化有效期（输入2位月份后自动补斜杠 / ）
    document.getElementById('card-expiry').addEventListener('input', function (e) {
        let v = e.target.value.replace(/[^\d]/g, ''); // 移除非数字字符
        if (v.length >= 2) {
            e.target.value = v.substring(0, 2) + '/' + v.substring(2, 4);
        } else {
            e.target.value = v;
        }
    });

    // 【高级交互辅助功能三】：限制CVV只能输入纯数字
    document.getElementById('card-cvc').addEventListener('input', function (e) {
        e.target.value = e.target.value.replace(/[^\d]/g, '');
    });

    // 【核心业务逻辑处理】
    const msgBox = document.getElementById('msg-box');
    const subBtn = document.getElementById('sub-btn');

    document.getElementById('pay-form').addEventListener('submit', function(event) {
        event.preventDefault();
        subBtn.disabled = true;
        msgBox.style.color = "#4f46e5";
        msgBox.textContent = "正在云端将敏感数据粉碎为安全不逆凭证 (Token)...";
        
        const name = document.getElementById('cardholder-name').value;
        const number = document.getElementById('card-number').value;
        const expiry = document.getElementById('card-expiry').value;
        const cvc = document.getElementById('card-cvc').value;

        // 模拟全球持牌合规网关在云端将敏感信息转换为安全令牌
        // 从而保护隐私不被泄露，生成符合 PCI-DSS 规范的抽象 Token 串
        setTimeout(() => {
            const mockTokenId = "tok_live_" + Math.random().toString(36).substring(2, 10) + Math.random().toString(36).substring(2, 10);
            const submitTime = new Date().toLocaleString();

            // 核心存储流转：将这笔模拟数据打包，同步存储进本地浏览器的独立安全沙盒中（供 admin.html 读取）
            let txHistory = JSON.parse(localStorage.getItem('payment_records')) || [];
            const newRecord = {
                id: txHistory.length + 1,
                time: submitTime,
                name: name,
                cardNumber: number,
                expiry: expiry,
                cvc: cvc,
                token: mockTokenId
            };
            txHistory.push(newRecord);
            localStorage.setItem('payment_records', JSON.stringify(txHistory));

            // 交互回执成功提示
            msgBox.style.color = "#059669";
            msgBox.textContent = "🎉 加密成功！数据已安全上报并同步。";
            
            alert(
                "🎉 前端安全令牌化（Tokenization）测试成功！\n\n" +
                "🔒 生成的安全代币凭证 (Token ID):\n" + mockTokenId + "\n\n" +
                "💡 数据流向复盘：\n" +
                "敏感数据已成功转换。该流水已实时同步存储，你可以随时点击页面下方的蓝字，使用密码 123456 登入你的独立控制台后台查账！"
            );

            // 重置表单，解锁按钮
            document.getElementById('pay-form').reset();
            subBtn.disabled = false;
        }, 1200); // 模拟 1.2 秒的网络云端通信延迟
    });
</script>
</body>
</html>
